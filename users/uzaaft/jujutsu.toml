[ui]
editor = "nvim"
default-command = ["log"]
diff-editor = ":builtin"
diff-formatter = ":git"

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
"fork_history(to, from)" = "fork_point(to | from)..@"

[aliases]
b = "branch"
n = "new"
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
retrunk = "rebase -d trunk()"

[template-aliases]
"format_short_id(id)" = "id.shortest(8)"


[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/id_ed25519.pub"

[git]
colocate = true
sign-on-push = true

[user]
name = "Uzair Aftab"
email = "git@uzaaft.me"
