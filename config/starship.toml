add_newline = false
command_timeout = 2000
format = "$directory$custom.jj$character"
right_format = "$nix_shell$python$cmd_duration$hostname$time"

[character]
success_symbol = "[❯](bold magenta)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold magenta)"
vimcmd_replace_one_symbol = "[❮](bold magenta)"
vimcmd_replace_symbol = "[❮](bold magenta)"
vimcmd_visual_symbol = "[❮](bold magenta)"

[cmd_duration]
min_time = 5000
format = "[$duration]($style) "
style = "yellow"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " "
read_only_style = "bold red"
style = "bold cyan"
truncate_to_repo = false

[git_branch]
disabled = true
format = "[$branch]($style) "
style = "cyan"
symbol = ""

[git_commit]
disabled = true
commit_hash_length = 8
format = "[@$hash]($style) "
only_detached = true
style = "cyan"
tag_disabled = true

[git_status]
disabled = true
ahead = "⇡${count}"
behind = "⇣${count}"
conflicted = "=${count}"
deleted = "✘${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
format = "([$all_status$ahead_behind]($style) )"
modified = "!${count}"
renamed = "»${count}"
staged = "+${count}"
stashed = "≡${count}"
style = "bright-black"
untracked = "*${count}"
up_to_date = ""

[custom.jj]
command = "jj-starship --strip-bookmark-prefix 'uzaaft/' --truncate-name 20 --bookmarks-display-limit 1"
format = "$output "
shell = ["sh"]
when = "jj-starship detect"

[hostname]
format = "[$hostname]($style) "
ssh_only = true
style = "bright-black"

[nix_shell]
format = "[$symbol$state(\\($name\\))]($style) "
heuristic = true
style = "cyan"
symbol = " "

[python]
detect_extensions = []
detect_files = [".python-version", "pyproject.toml", "requirements.txt", "setup.py", "setup.cfg", "uv.lock"]
detect_folders = [".venv", "venv"]
format = "[${symbol}${version}(\\($virtualenv\\))]($style) "
style = "bright-black"
symbol = "py "

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M:%S"
